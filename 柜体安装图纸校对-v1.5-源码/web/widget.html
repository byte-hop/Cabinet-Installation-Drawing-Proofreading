<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>柜图校对悬浮球</title>
  <link rel="stylesheet" href="/widget.css">
</head>
<body data-mode="idle">
  <div class="widget-root" id="widgetRoot">
    <button class="orb" id="orb" type="button" aria-label="打开柜图校对">
      <span class="orb-ring"><img id="avatar" src="/api/widget/avatar" alt=""></span>
      <span class="orb-hint">拖入图纸</span>
    </button>

    <button class="gear" id="gear" type="button" aria-label="悬浮球设置" title="悬浮球设置">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 8.2A3.8 3.8 0 1 0 12 15.8 3.8 3.8 0 0 0 12 8.2Z" stroke="currentColor" stroke-width="1.5"/><path d="m19.1 13.8 1.3 1-.9 2.2-1.7-.1a7.7 7.7 0 0 1-1.6 1.5l.2 1.7-2.2.9-1-1.3a7.7 7.7 0 0 1-2.2 0l-1 1.3-2.2-.9.2-1.7a7.7 7.7 0 0 1-1.6-1.5l-1.7.1-.9-2.2 1.3-1a7.6 7.6 0 0 1 0-2.4l-1.3-1 .9-2.2 1.7.1a7.7 7.7 0 0 1 1.6-1.5l-.2-1.7 2.2-.9 1 1.3a7.7 7.7 0 0 1 2.2 0l1-1.3 2.2.9-.2 1.7a7.7 7.7 0 0 1 1.6 1.5l1.7-.1.9 2.2-1.3 1a7.6 7.6 0 0 1 0 2.4Z" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/></svg>
    </button>

    <div class="drop-panel" id="dropPanel">
      <span class="drop-avatar"><img id="dropAvatar" src="/api/widget/avatar" alt=""></span>
      <span class="drop-copy">
        <span class="drop-kicker" id="dropKicker">PDF 图纸</span>
        <strong id="dropTitle">将图纸拖拽进来，开始核对！</strong>
        <small id="dropSub">支持 领客屋 / 遨森 / 英驰</small>
      </span>
      <span class="drop-badge" id="dropBadge">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 16V4.5M7.8 8.7 12 4.5l4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 14.5v3A2.5 2.5 0 0 0 7.5 20h9a2.5 2.5 0 0 0 2.5-2.5v-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </span>
    </div>

    <div class="widget-menu" id="widgetMenu">
      <div class="menu-head">
        <b>悬浮球</b>
        <button type="button" data-widget-action="cancel" aria-label="关闭">×</button>
      </div>
      <button type="button" data-widget-action="restore">返回主界面</button>
      <button type="button" data-widget-action="change">更换悬浮球图片</button>
      <div class="menu-size">
        <div class="menu-size-head">
          <span>悬浮球大小</span>
          <b id="menuSizeValue">64</b>
        </div>
        <input id="menuSizeRange" type="range" min="44" max="160" step="2" value="64" aria-label="悬浮球大小">
      </div>
      <button type="button" class="danger" data-widget-action="exit">退出程序</button>
    </div>
  </div>
  <script src="/widget.js"></script>
</body>
</html>
